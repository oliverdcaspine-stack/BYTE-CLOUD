<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#26262e" stroke-width="4"/>
  
  <!-- Geometric Industrial Slab "B" & Cloud Elements -->
  <g filter="url(#glow)">
    <!-- Slab Stem -->
    <rect x="130" y="110" width="54" height="292" rx="6" fill="#00f0ff"/>
    <rect x="100" y="110" width="114" height="34" rx="4" fill="#00f0ff"/>
    <rect x="100" y="368" width="114" height="34" rx="4" fill="#00f0ff"/>

    <!-- Upper geometric block / bowl -->
    <path d="M 184 110 L 290 110 C 330 110 354 135 354 175 C 354 215 330 240 290 240 L 184 240 Z" fill="none" stroke="#00f0ff" stroke-width="38" stroke-linejoin="miter"/>

    <!-- Lower geometric block / bowl with violet accent -->
    <path d="M 184 240 L 305 240 C 350 240 376 268 376 312 C 376 356 350 384 305 384 L 184 384 Z" fill="none" stroke="url(#neonCyan)" stroke-width="38" stroke-linejoin="miter"/>

    <!-- Digital Cloud Circuit Nodes -->
    <circle cx="410" cy="180" r="10" fill="#a855f7"/>
    <line x1="365" y1="180" x2="400" y2="180" stroke="#a855f7" stroke-width="6"/>
    <circle cx="430" cy="240" r="12" fill="#00f0ff"/>
    <line x1="380" y1="240" x2="418" y2="240" stroke="#00f0ff" stroke-width="6"/>
    <circle cx="410" cy="300" r="10" fill="#a855f7"/>
    <line x1="380" y1="300" x2="400" y2="300" stroke="#a855f7" stroke-width="6"/>
  </g>
</svg>

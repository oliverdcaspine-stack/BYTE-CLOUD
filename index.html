    <!-- Suppress Vite HMR socket errors in sandbox container where HMR is disabled -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        window.addEventListener('unhandledrejection', function(event) {
          if (event?.reason?.message && event.reason.message.includes('WebSocket closed without opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        if (!window.WebSocket) return;
        const NativeWebSocket = window.WebSocket;
        class MockViteHmrSocket extends EventTarget {
          constructor(url, protocols) {
            super();
            this.url = url;
            this.protocols = protocols;
            this.readyState = 1;
            this.CONNECTING = 0;
            this.OPEN = 1;
            this.CLOSING = 2;
            this.CLOSED = 3;
            setTimeout(() => {
              this.dispatchEvent(new Event('open'));
            }, 10);
          }
          send() {}
          close() {
            this.readyState = 3;
            this.dispatchEvent(new CloseEvent('close', { wasClean: true }));
          }
        }
        MockViteHmrSocket.CONNECTING = 0;
        MockViteHmrSocket.OPEN = 1;
        MockViteHmrSocket.CLOSING = 2;
        MockViteHmrSocket.CLOSED = 3;

        window.WebSocket = function(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes(':24678')))) {
            return new MockViteHmrSocket(url, protocols);
          }
          return new NativeWebSocket(url, protocols);
        };
        Object.assign(window.WebSocket, NativeWebSocket);
        window.WebSocket.prototype = NativeWebSocket.prototype;
      })();
    </script>
